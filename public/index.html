<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My tiny world</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/x-icon" href="assets/logo/earth.ico" />
  <link rel="shortcut icon" href="assets/logo/earth.ico" />

  <!-- Import map: permite usar "import * as THREE from 'three'" no navegador,
       apontando para o pacote three.js servido pelo próprio Express. -->
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "three/examples/jsm/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="crosshair"></div>

  <div id="hud">
    <span id="fps">-- fps</span>
    <button id="music-toggle" class="hud-button" type="button">Música: Iniciar</button>
    <button id="volume-down" class="hud-button" type="button">-</button>
    <button id="volume-up" class="hud-button" type="button">+</button>
  </div>

  <div id="interaction-hint" class="hidden">Toque ou clique para abrir o vídeo</div>

  <div id="touch-controls" class="hidden">
    <div id="touch-dpad">
      <span class="touch-spacer"></span>
      <button type="button" id="btn-up" class="touch-button">↑</button>
      <span class="touch-spacer"></span>
      <button type="button" id="btn-left" class="touch-button">←</button>
      <button type="button" id="btn-down" class="touch-button">↓</button>
      <button type="button" id="btn-right" class="touch-button">→</button>
    </div>
    <div id="touch-actions">
      <button type="button" id="btn-jump" class="touch-button action-button">Pular</button>
      <button type="button" id="btn-run" class="touch-button action-button">Correr</button>
    </div>
    <div id="touch-label">Arraste para olhar. Toque duplo e segure para correr.</div>
  </div>
  <div id="radial-left" class="radial-control" aria-label="Controle esquerdo">
    <div class="radial-base"></div>
    <div class="radial-knob"></div>
  </div>
  <div id="radial-right" class="radial-control" aria-label="Controle direito">
    <div class="radial-base"></div>
    <div class="radial-knob"></div>
  </div>

  <!-- GameBoy-style overlay -->
  <div id="gb-overlay" class="gb-overlay">
    <div class="gb-body">
      <div id="gb-orb" aria-label="Orbita camera"></div>
      <!-- Actions kept (A/B) -->
      <div class="gb-actions">
        <button id="gb-b" class="gb-button touch-button action-button">B</button>
        <button id="gb-a" class="gb-button touch-button action-button">A</button>
      </div>
    </div>
    <!-- Two analog sticks fixed to corners for mobile vertical -->
    <div id="gb-left-stick" class="gb-stick" aria-hidden="false">
      <div class="gb-stick-base"></div>
      <div class="gb-stick-knob"></div>
    </div>
    <div id="gb-right-stick" class="gb-stick" aria-hidden="false">
      <div class="gb-stick-base"></div>
      <div class="gb-stick-knob"></div>
    </div>
  </div>

  <div id="blocker" class="hidden">
    <div id="instructions">
      <h1>Mini Planet</h1>
      <p>Toque para jogar ou clique para entrar.</p>
      <p class="controls">
        WASD — mover &nbsp;|&nbsp; SHIFT — correr &nbsp;|&nbsp; ESPAÇO — pular &nbsp;|&nbsp; MOUSE/TOQUE — olhar ao redor
      </p>
    </div>
  </div>

  <div id="youtube-overlay" class="hidden">
    <div class="overlay-backdrop"></div>
    <div class="overlay-content">
      <button id="youtube-close" type="button">×</button>
      <iframe id="youtube-iframe" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>

  <div id="arcade-overlay" class="hidden">
    <div class="overlay-backdrop"></div>
    <div class="overlay-content arcade-content">
      <div class="arcade-titlebar">
        <span>Arcade</span>
        <button id="arcade-close" type="button" class="overlay-close-button">×</button>
      </div>
      <iframe id="arcade-iframe" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Mobile zoom bar (drag to zoom) -->
  <div id="zoom-bar" aria-hidden="false">
    <div class="zoom-track"></div>
    <div class="zoom-thumb"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
